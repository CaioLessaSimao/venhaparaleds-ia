[tool.poetry]
name = "lerpdf"
version = "0.1.0"
description = "lerPdf using crewAI"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<=3.13"
crewai = {extras = ["tools"], version = "^0.28.8"}
langchain_google_genai = "1.0.3"
google-generativeai = "0.5.2"
pypdf2 = "^3.0.1"

[tool.poetry.scripts]
lerpdf = "lerpdf.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"